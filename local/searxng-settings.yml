use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - bing
      - qwant
      - yahoo
      - mwmbl
      - yep
      - yacy

general:
  instance_name: Qwen Local Search

search:
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-me
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0

# The standard Brave and DuckDuckGo HTML engines are excluded because container
# IP ranges are regularly challenged or rate-limited. The remaining free
# engines are queried in parallel: a block from one engine leaves results from
# the others intact. The entrypoint enables this official API engine only when
# BRAVE_SEARCH_API_KEY is set in local/compose.env.
engines:
  # These are disabled in SearXNG's default public-instance configuration.
  # Explicitly enable them for this private, local-only instance.
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
  - name: yep
    disabled: false
  - name: yacy
    disabled: false
  - name: brave api
    engine: braveapi
    categories: [general, web]
    shortcut: bapi
    inactive: __BRAVE_API_INACTIVE__
    api_key: "__BRAVE_SEARCH_API_KEY__"
    results_per_page: 10
