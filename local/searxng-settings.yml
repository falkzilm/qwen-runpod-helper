use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - wikipedia

general:
  instance_name: Qwen Local Search

search:
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-me
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
