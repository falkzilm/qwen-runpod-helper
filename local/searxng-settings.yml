use_default_settings:
  engines:
    keep_only:
      - wikipedia

general:
  instance_name: Qwen Local Search

search:
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: change-me
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0

# The public HTML search pages used by the standard Brave and DuckDuckGo
# engines are intentionally excluded: container IP ranges are regularly
# challenged or rate-limited. The entrypoint enables this official API engine
# only when BRAVE_SEARCH_API_KEY is set in local/compose.env.
engines:
  - name: brave api
    engine: braveapi
    categories: [general, web]
    shortcut: bapi
    inactive: __BRAVE_API_INACTIVE__
    api_key: "__BRAVE_SEARCH_API_KEY__"
    results_per_page: 10
