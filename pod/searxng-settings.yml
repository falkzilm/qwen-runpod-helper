use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - wikipedia

general:
  debug: false
  instance_name: Qwen RunPod Search

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: 127.0.0.1
  port: 8888
  secret_key: overridden-by-SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
